when@dev:
    web_profiler:
        toolbar: true

    framework:
        profiler:
            # Сбор профиля на каждый успешный запрос на этом диске — около 2 с.
            only_exceptions: true
            collect_serializer_data: true

when@test:
    framework:
        profiler:
            collect: false
            collect_serializer_data: true
