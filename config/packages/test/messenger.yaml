# Транспорты сообщений в тестах.
#
# Без этого файла тесты уходят в настоящие RabbitMQ и Postgres-очередь:
# UserSyncEntityListener публикует UserSyncMessage прямо во время flush, и
# любой тест, который сохраняет пользователя, падал с
# «AMQPConnectionException: hostname lookup failed». То есть проверить логин
# было нельзя без поднятого брокера — а брокер в юнит-прогоне не нужен.
#
# in-memory:// складывает сообщения в память процесса: продюсер отрабатывает
# полностью (включая сериализацию и stamps), ничего наружу не уходит, а тест
# при желании может достать отправленное из транспорта и проверить.
framework:
    messenger:
        transports:
            async: 'in-memory://'
            event_bus: 'in-memory://'
            outbox: 'in-memory://'
            failed: 'in-memory://'
