server {
	listen 80;
	index index.php index.html;
	server_name localhost;
	error_log /var/log/nginx/error.log;
	access_log /var/log/nginx/access.log;
	root /var/www/html/public;

	# Max body size file upload
	client_max_body_size 52M;

	# Метрики для Prometheus (количество запросов и соединений). Доступно только из внутренней Docker-сети.
	location /nginx_status {
		stub_status on;
		allow 172.16.0.0/12;
		allow 192.168.0.0/16;
		allow 10.0.0.0/8;
		deny all;
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	# Приватное хранилище (оригиналы документов, вложения, файлы пользователей,
	# чаты, закупки). Раздаётся статикой в обход Symfony — firewall этот путь не
	# видит, поэтому единственная защита здесь сетевая.
	#
	# Доступ только из внутренней Docker-сети: сюда ходит OnlyOffice
	# DocumentServer, которому нужен прямой http-URL исходника
	# (DocumentCreateFromTemplateController::edit_docx). Наружу этот путь не
	# проксируется — соответствующие location и rewrite сняты во фронте
	# (analytics_platform: docker_env/nginx/config/default.conf, next.config.ts).
	#
	# CORS здесь был `*`: любой сайт мог читать содержимое файлов из браузера
	# пользователя. Внутрисетевому потребителю CORS не нужен вовсе.
	location /uploads/ {
		alias /uploads/;

		# Без real_ip проверка ниже смотрела бы на IP TCP-пира. Любой запрос,
		# пришедший через прокси внутри docker-сети (например через nginx
		# фронта), выглядел бы как «свой» и проходил allow — то есть ACL
		# закрывал бы путь только до тех пор, пока никто не вернёт
		# проксирование наружу. С real_ip адрес берётся из X-Forwarded-For,
		# который проставляет прокси, и запрос из интернета отсекается по
		# настоящему адресу клиента.
		#
		# Доверяем заголовку только от источников из внутренних подсетей;
		# OnlyOffice ходит напрямую и X-Forwarded-For не шлёт, поэтому для
		# него остаётся адрес контейнера.
		set_real_ip_from 172.16.0.0/12;
		set_real_ip_from 192.168.0.0/16;
		set_real_ip_from 10.0.0.0/8;
		real_ip_header X-Forwarded-For;
		real_ip_recursive on;

		allow 172.16.0.0/12;
		allow 192.168.0.0/16;
		allow 10.0.0.0/8;
		deny all;
	}

	# Проксирование генерации превью через imgproxy (file_storage)
	location /media/preview/ {
		resolver 127.0.0.11 valid=60s ipv6=off;
		set $upstream_host nginx_imgproxy;

		# Срезаем префикс /media/preview/ перед отправкой в imgproxy
		rewrite ^/media/preview/(.*)$ /$1 break;
		proxy_pass http://$upstream_host:80;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass php:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}
}
