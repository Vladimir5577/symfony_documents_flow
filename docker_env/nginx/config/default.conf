server {
	listen 80;
	index index.php index.html;
	server_name localhost;
	error_log /var/log/nginx/error.log;
	access_log /var/log/nginx/access.log;
	root /var/www/html/public;

	# Max body size file upload
	client_max_body_size 52M;

	# Метрики для Prometheus (количество запросов и соединений). Доступно только из внутренней Docker-сети.
	location /nginx_status {
		stub_status on;
		allow 172.16.0.0/12;
		allow 192.168.0.0/16;
		allow 10.0.0.0/8;
		deny all;
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	# Private files are served only after the Symfony controller checks access.
    location /uploads/ {
        internal;
        alias /uploads/;
        add_header X-Content-Type-Options nosniff always;
    }

    # Chat has no authenticated download controller yet; its existing URLs remain usable.
    location ^~ /uploads/chats/ {
        alias /uploads/chats/;
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Legacy OnlyOffice still fetches these flat DOCX files directly. Only from the
    # docker/private networks it runs in: a browser outside must not read originals by name.
    location ~ ^/uploads/documents/(originals|templates)/([^/]+\.docx)$ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        alias /uploads/documents/$1/$2;
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Old post thumbnails bypass publication checks; use the authorized image routes.
    location ^~ /media/cache/post_image_preview/ { return 404; }
    location ^~ /media/cache/resolve/post_image_preview/ { return 404; }

	# Проксирование генерации превью через imgproxy (file_storage)
	location /media/preview/ {
		resolver 127.0.0.11 valid=60s ipv6=off;
		set $upstream_host nginx_imgproxy;

		# Срезаем префикс /media/preview/ перед отправкой в imgproxy
		rewrite ^/media/preview/(.*)$ /$1 break;
		proxy_pass http://$upstream_host:80;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass php:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param APP_X_ACCEL_REDIRECT 1;
	}
}
