# Лимит попыток входа по IP (BE-04 / SEC-04). Symfony login_throttling ключуется
# по паре username+IP и не ловит перебор ЛОГИНОВ с одним известным паролем —
# для этого нужен лимит по IP. Считаем только POST: GET-форма входа не в счёт.
# conf.d/*.conf включается внутрь http{}, поэтому map/limit_req_zone здесь законны.
map $request_method $login_post_key {
	default "";
	POST    $binary_remote_addr;
}
limit_req_zone $login_post_key zone=login_post:10m rate=10r/m;

server {
	listen 80;
	index index.php index.html;
	server_name localhost;
	error_log /var/log/nginx/error.log;
	access_log /var/log/nginx/access.log;
	root /var/www/html/public;

	# Max body size file upload
	client_max_body_size 52M;

	# Настоящий адрес клиента за прокси (nginx фронта) — иначе и лимит входа, и
	# ACL ниже видели бы IP прокси. Доверяем X-Forwarded-For только из внутренних сетей.
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	set_real_ip_from 10.0.0.0/8;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	# Метрики для Prometheus (количество запросов и соединений). Доступно только из внутренней Docker-сети.
	location /nginx_status {
		stub_status on;
		allow 172.16.0.0/12;
		allow 192.168.0.0/16;
		allow 10.0.0.0/8;
		deny all;
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	# Форма входа legacy: не больше 10 POST в минуту с одного адреса (+ burst 10).
	location = /login {
		limit_req zone=login_post burst=10 nodelay;
		limit_req_status 429;
		try_files $uri /index.php?$query_string;
	}

	# Callback OnlyOffice (BE-02 / BE-14): server-to-server из docker-сети,
	# снаружи ему делать нечего. Внутри контроллера — ещё и HMAC-токен.
	location = /save_docx {
		allow 172.16.0.0/12;
		allow 192.168.0.0/16;
		allow 10.0.0.0/8;
		deny all;
		try_files $uri /index.php?$query_string;
	}

	# Внутренний API для Go-сервисов (BE-15 / SEC-13): firewall Symfony на нём
	# выключен, единственная защита — ключ и сетевой ACL. ^~ — чтобы префикс
	# выиграл у регулярки \.php$; после try_files внутренний редирект на
	# /index.php снова пройдёт через location ~ \.php$.
	location ^~ /api/internal {
		allow 172.16.0.0/12;
		allow 192.168.0.0/16;
		allow 10.0.0.0/8;
		deny all;
		try_files $uri /index.php?$query_string;
	}

	# Приватное хранилище (оригиналы документов, вложения, файлы пользователей,
	# чаты, закупки). Раздаётся статикой в обход Symfony — firewall этот путь не
	# видит, поэтому единственная защита здесь сетевая.
	#
	# Доступ только из внутренней Docker-сети: сюда ходит OnlyOffice
	# DocumentServer, которому нужен прямой http-URL исходника
	# (DocumentCreateFromTemplateController::edit_docx). Наружу этот путь не
	# проксируется — соответствующие location и rewrite сняты во фронте
	# (analytics_platform: docker_env/nginx/config/default.conf, next.config.ts).
	#
	# CORS здесь был `*`: любой сайт мог читать содержимое файлов из браузера
	# пользователя. Внутрисетевому потребителю CORS не нужен вовсе.
	location /uploads/ {
		alias /uploads/;

		# Без real_ip проверка ниже смотрела бы на IP TCP-пира. Любой запрос,
		# пришедший через прокси внутри docker-сети (например через nginx
		# фронта), выглядел бы как «свой» и проходил allow — то есть ACL
		# закрывал бы путь только до тех пор, пока никто не вернёт
		# проксирование наружу. С real_ip адрес берётся из X-Forwarded-For,
		# который проставляет прокси, и запрос из интернета отсекается по
		# настоящему адресу клиента.
		#
		# Доверяем заголовку только от источников из внутренних подсетей;
		# OnlyOffice ходит напрямую и X-Forwarded-For не шлёт, поэтому для
		# него остаётся адрес контейнера.
		set_real_ip_from 172.16.0.0/12;
		set_real_ip_from 192.168.0.0/16;
		set_real_ip_from 10.0.0.0/8;
		real_ip_header X-Forwarded-For;
		real_ip_recursive on;

		allow 172.16.0.0/12;
		allow 192.168.0.0/16;
		allow 10.0.0.0/8;
		deny all;
	}

	# Проксирование генерации превью через imgproxy (file_storage)
	location /media/preview/ {
		resolver 127.0.0.11 valid=60s ipv6=off;
		set $upstream_host nginx_imgproxy;

		# Срезаем префикс /media/preview/ перед отправкой в imgproxy
		rewrite ^/media/preview/(.*)$ /$1 break;
		proxy_pass http://$upstream_host:80;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass php:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}
}
