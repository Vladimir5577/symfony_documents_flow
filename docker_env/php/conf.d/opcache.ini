; Проект смонтирован с диска Windows. Проверка mtime всех скриптов
; на каждый запрос занимает несколько секунд. Раз в минуту достаточно,
; чтобы подхватить правки PHP без рестарта php-fpm.
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=60
